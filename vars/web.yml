---

__snippet_nginx__base: |-
  listen 443 ssl;
  listen [::]:443 ssl;
  {{ _snippet_nginx__http2 | indent(width=2) }}

  {{ _snippet_nginx__ssl | indent(width=2) }}

  {{ _snippet_nginx__realip | indent(width=2) }}

  error_page   500 502 503 504  /50x.html;

  server_tokens off;    # Prevent nginx HTTP Server Detection


_snippet_nginx__http2: |-
  http2 on;
  # better http2 performance
  http2_body_preread_size 256k;
  #http2_body_preread_size 512k;
  sendfile        on;
  tcp_nopush     on;
  tcp_nodelay    on;
  keepalive_requests 100;
  keepalive_timeout 60; # keepalive max idle time (seconds)

_snippet_nginx__ssl: |-
  # 缓存会话的有效期为 10 分钟（默认通常为5分钟，可视情况调长）
  ssl_session_timeout 10m;
  # 开启共享缓存，名为"SSL"，大小为10MB（约可缓存40,000个会话）
  ssl_session_cache shared:SSL:10m;
  ssl_buffer_size 8k;
  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers on;
  ssl_stapling on;
  ssl_stapling_verify on;

_snippet_nginx__realip: |-
  #set_real_ip_from 172.30.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;
  real_ip_recursive on;

_snippet_nginx__rev_proxy_header: |-
  # for header
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Server $host;
  #proxy_set_header X-Forwarded-For "$http_x_forwarded_for $realip_remote_addr";
  proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
  proxy_set_header X-Forwarded-Proto $scheme;
  # for websocket forwarding
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

_snippet_nginx__rev_proxy_grpc: |-
  # buffering related, useful for http2
  client_body_buffer_size 256k;
  client_max_body_size 0;
  proxy_buffers 16 128k;
  grpc_buffer_size 128k;
  proxy_buffer_size 128k;
  proxy_busy_buffers_size 512k;
  proxy_temp_file_write_size 512k;
  # timeout tuning
  keepalive_timeout 65;
  keepalive_requests 100000;
  grpc_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
  grpc_read_timeout 65;
  grpc_send_timeout 65;
  grpc_socket_keepalive on;

_snippet_nginx__nextcloud_fileupload: |-
  # set max upload size and increase upload timeout:
  client_max_body_size 0;
  client_body_timeout 300s;
  fastcgi_buffers 64 4K;
  # The settings allows you to optimize the HTTP2 bandwidth.
  # See https://blog.cloudflare.com/delivering-http-2-upload-speed-improvements/
  # for tuning hints
  client_body_buffer_size 512k;

_snippet_nginx__allow_lan_only: |-
  # TODO: changed below ip ranges for you LAN settings.
  allow 192.168.200.0/23;
  allow 172.30.250.0/23;
  allow 127.0.0.1;
  allow ::1;
  deny all;
